services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: miguisanson_dev
      POSTGRES_PASSWORD: miguisanson_dev
      POSTGRES_USER: miguisanson
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miguisanson -d miguisanson_dev"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
